<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Riley Autobots Energon Vault</title><style>:root{--bg:#0d0f13;--panel:#161a21;--p2:#1d222b;--line:#2c333f;--txt:#e6e9ee;--mut:#8a93a3;--red:#e0262f;--blue:#1f6fff;--cyan:#22e4ff;--ok:#2ee66b;--warn:#ffc531;--crit:#ff3b4a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1a2030 0,var(--bg) 60%);background-color:var(--bg);color:var(--txt);font:13px/1.4 "Segoe UI",Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:2px solid var(--red);background:linear-gradient(90deg,#1a0d10,#0d1426)}
.logo{width:52px;height:52px;border-radius:50%;box-shadow:0 0 14px #2ee66b88}h1{margin:0;font-size:20px;letter-spacing:3px}h1 span{color:var(--cyan)}.sub{color:var(--mut);font-size:12px}
.priv{margin-left:auto;border:1px solid var(--warn);color:var(--warn);padding:4px 10px;border-radius:4px;font-weight:600;font-size:11px}
main{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 22px}.wide{grid-column:span 3}
.panel{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--blue);border-radius:8px;padding:12px 14px}
h2{margin:0 0 10px;font-size:13px;letter-spacing:2px;color:var(--cyan);text-transform:uppercase}
.kpis{display:flex;gap:12px;flex-wrap:wrap}.kpi{background:var(--p2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;flex:1;min-width:170px}.kpi b{display:block;font-size:22px}.kpi small{color:var(--mut)}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;margin:2px 3px 0 0;border:1px solid var(--line);color:var(--mut)}
.b-real{border-color:var(--ok);color:var(--ok)}.b-mem{border-color:var(--cyan);color:var(--cyan)}.b-nc{border-color:var(--crit);color:var(--crit)}.b-ex{border-color:var(--warn);color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:var(--p2);border:1px solid var(--line);border-radius:6px;padding:10px}.card h3{margin:0 0 6px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:500}.r{text-align:right}
.trip{background:#2a1a08}.neg{color:var(--crit)}.pos{color:var(--ok)}.mut{color:var(--mut)}
.ctl{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:10px}.ctl label{font-size:11px;color:var(--mut)}.ctl input,.ctl select{width:100%;background:var(--p2);color:var(--txt);border:1px solid var(--line);padding:4px;border-radius:4px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;border-bottom:1px solid var(--line);margin-top:6px}.bar{flex:1;position:relative}.bar div{position:absolute;bottom:0;width:100%;border-radius:3px 3px 0 0}.bar span{position:absolute;bottom:-16px;width:100%;text-align:center;font-size:10px;color:var(--mut)}
.alert{background:#3a0d12;border:2px solid var(--crit);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:14px}.warn{color:var(--warn)}.lockwrap{display:flex;min-height:100vh;align-items:center;justify-content:center}.lockbox{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--red);border-radius:8px;padding:24px;width:360px;text-align:center}.lockbox input{width:100%;padding:8px;margin:10px 0;background:var(--p2);color:var(--txt);border:1px solid var(--line);border-radius:4px}.lockbox button{background:var(--blue);color:#fff;border:0;padding:8px 18px;border-radius:4px;cursor:pointer}
</style></head><body>
